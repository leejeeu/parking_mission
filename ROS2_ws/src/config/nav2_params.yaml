# ROS2 Humble / Nav2 표준 파라미터 템플릿
#
# 차량 실측 스펙 출처: UMK 저장소(track_drive/track_drive/config.py, 실제속도측정.md).
# 이 패키지의 parking_mission/vehicle_spec.py에 동일 값이 복제돼 있음(UMK 값이 바뀌면 같이 갱신).
#   - 축거(WHEELBASE_M)    : 0.335 m (줄자 실측)
#   - 차체 크기             : 길이 0.64m x 폭 0.31m x 높이 0.20m (실측)
#   - 지상속도              : cmd=5 -> 0.431 m/s, cmd=20 -> 1.449 m/s (2026-08-17/18 실측 회귀)
#   - 최대 조향각(ANGLE_MAX): 80도(서보 클램프값, 저속 주행 중 실제 도달 가능한 각도는 별도)
# 가속도/최대 각속도는 실측 데이터가 없어 위 값들로부터 역산한 추정치("TODO(로봇스펙)"
# 표시 없이도 아래 각주에 근거를 남김) — 실차에서 진동/오버슈트 관찰 후 재조정 필요.
# base_link 기준(차량 중심 근사, 정확한 축 위치는 미실측)으로 모든 프레임을 통일함
# (footprint/laser 등 별도 링크가 없는 이 로봇 구조에 맞춰 footprint 프레임 생략).

amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_link"   # 이 로봇엔 별도 footprint 프레임이 없어 base_link로 통일
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan
    set_initial_pose: false   # 초기 pose는 parking_navigator 노드가 /initialpose로 발행

amcl_map_client:
  ros__parameters:
    use_sim_time: false

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: false

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    default_nav_to_pose_bt_xml: ""
    default_nav_through_poses_bt_xml: ""
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.05     # 주차 정밀도: 5cm
      yaw_goal_tolerance: 0.05    # 약 3도
      stateful: true

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: true
      min_vel_x: 0.0
      min_vel_y: 0.0
      # 실측 최대 지상속도는 1.449 m/s(cmd=20, 실제속도측정.md)지만, 주차는 5cm/3도 정밀도가
      # 필요한 정지 기동이라 안전 여유를 크게 두고 0.4 m/s로 제한(추후 실차에서 오버슈트/
      # 진동 없으면 올려도 됨).
      max_vel_x: 0.4
      max_vel_y: 0.0
      # steer=30deg, v=0.4m/s 가정 시 angular_z = v*tan(steer)/WHEELBASE_M ≈ 0.69 rad/s 역산 —
      # 실측 아님, 추정치.
      max_vel_theta: 0.8
      min_speed_xy: 0.0
      max_speed_xy: 0.4
      min_speed_theta: 0.0
      acc_lim_x: 0.5           # 실측 가속도 데이터 없음 — 저속 주차 기동 기준 보수적 추정치
      acc_lim_y: 0.0
      acc_lim_theta: 1.5       # 실측 없음, 추정치
      decel_lim_x: -0.5
      decel_lim_y: 0.0
      decel_lim_theta: -1.5
      vx_samples: 20
      vy_samples: 0
      vtheta_samples: 20
      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.05
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics:
        [
          "RotateToGoal",
          "Oscillation",
          "BaseObstacle",
          "GoalAlign",
          "PathAlign",
          "PathDist",
          "GoalDist",
        ]
      # [2026-08-18] 0.02 -> 0.5로 상향. 원래 값은 표준 turtlebot3 템플릿에서 그대로 가져온
      # 것인데, PathAlign(32)/PathDist(32) 등 경로추종 비용에 비해 장애물 회피 비중이 너무
      # 낮아서 실행 중(컨트롤러 단계)엔 벽 근접을 거의 무시하고 경로를 고수하는 쪽으로
      # 흘렀을 수 있다 — 팽창영역(플래너 단계)만으로는 실행 중 오차/드리프트를 못 잡아준다.
      BaseObstacle.scale: 0.5
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # 실측 길이0.64m x 폭0.31m의 외접원 반경 ≈ 0.36m(base_link=차량 중심 근사, 정확한
      # 축 위치 미실측이라 근사치).
      robot_radius: 0.36
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # [2026-08-18] 기존 inflation_radius(0.3)가 robot_radius(0.36)보다 작아서 팽창 비용
        # 구배가 차체 반경 안쪽에서 끝나버리는 버그였다 — 사실상 "벽에 거의 닿아야 비용이
        # 오른다"는 뜻이라 벽에 붙는 경로/충돌을 못 막았다. inflation_radius는 반드시
        # robot_radius보다 커야 실제 완충구역이 생긴다(0.36 + 약 0.1m 여유 = 0.45).
        cost_scaling_factor: 4.0
        inflation_radius: 0.45
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.36      # local_costmap과 동일 근거(실측 길이/폭 외접원)
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # local_costmap과 동일한 이유로 robot_radius(0.36)보다 크게 수정.
        cost_scaling_factor: 4.0
        inflation_radius: 0.45
      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: false
    # yaml_filename은 launch 인자(map)로 전달됨

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    # [2026-08-18] NavfnPlanner(격자 기반 순수 A*, 차량 회전반경을 모른다) -> SmacPlannerHybrid로
    # 교체. "벽에 부딪히고 멈추는" 문제의 한 원인이 여기 있었다 — 격자 A*가 짠 경로는 코너에서
    # 급하게 꺾이는 지점이 생길 수 있는데, 이 차는 Ackermann 조향이라 실제 추종 제어기가 그
    # 꺾임을 못 따라가고 코너를 잘라먹으며 벽을 스칠 수 있다. SmacPlannerHybrid는 최소 회전반경
    # 제약을 넣어 "차가 실제로 따라갈 수 있는" 곡선 경로만 생성한다(=사용자가 말한 Modified A*).
    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerHybrid"
      downsample_costmap: false
      downsampling_factor: 1
      tolerance: 0.25
      allow_unknown: false   # 주차장은 맵 밖 미탐사 영역으로 계획하지 않도록 false 권장
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      # REEDS_SHEPP: 전진뿐 아니라 후진도 허용(전진만 되는 DUBIN 대신) — 주차는 후진 진입이
      # 필요한 경우가 많다.
      motion_model_for_search: "REEDS_SHEPP"
      angle_quantization_bins: 72
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      # 실측 축거(WHEELBASE_M=0.335m) 기준, 최대조향각을 UMK planner/hybrid_astar.py와 동일한
      # 30도(실측 아닌 설계값)로 가정해 산출: r = wheelbase / tan(30°) ≈ 0.58m. 이보다 타이트한
      # 회전은 실제로 못 도니 약간의 여유를 더해 0.6m로 설정(실차에서 좁은 코너 진입 실패하면
      # 낮추고, 진동/오버슈트 있으면 올릴 것).
      minimum_turning_radius: 0.6
      reverse_penalty: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      retrospective_penalty: 0.025
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_timeout: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.5
    min_rotational_vel: 0.1
    rotational_acc_lim: 1.5

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.4, 0.0, 0.8]     # controller_server FollowPath와 동일 근거
    min_velocity: [-0.4, 0.0, -0.8]
    max_accel: [0.5, 0.0, 1.5]        # controller_server FollowPath와 동일 근거(실측 없음, 추정치)
    max_decel: [-0.5, 0.0, -1.5]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
