# ROS2 Humble / Nav2 표준 파라미터 템플릿
#
# 차량 실측 스펙 출처: UMK 저장소(track_drive/track_drive/config.py, 실제속도측정.md).
# 이 패키지의 parking_mission/vehicle_spec.py에 동일 값이 복제돼 있음(UMK 값이 바뀌면 같이 갱신).
#   - 축거(WHEELBASE_M)    : 0.335 m (줄자 실측)
#   - 차체 크기             : 길이 0.64m x 폭 0.31m x 높이 0.20m (실측)
#   - 지상속도              : cmd=5 -> 0.431 m/s, cmd=20 -> 1.449 m/s (2026-08-17/18 실측 회귀)
#   - 최대 조향각(ANGLE_MAX): 80도(서보 클램프값, 저속 주행 중 실제 도달 가능한 각도는 별도)
# 가속도/최대 각속도는 실측 데이터가 없어 위 값들로부터 역산한 추정치("TODO(로봇스펙)"
# 표시 없이도 아래 각주에 근거를 남김) — 실차에서 진동/오버슈트 관찰 후 재조정 필요.
# base_link 기준(차량 중심 근사, 정확한 축 위치는 미실측)으로 모든 프레임을 통일함
# (footprint/laser 등 별도 링크가 없는 이 로봇 구조에 맞춰 footprint 프레임 생략).

amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_link"   # 이 로봇엔 별도 footprint 프레임이 없어 base_link로 통일
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    # [2026-08-22] 병목구간/도킹 재현에서 AMCL 추정 pose가 0.6초 사이 2m 가까이
    # "점프"하는 현상을 실측(parking_navigator.py _lidar_front_clearance 주석 참고,
    # Gazebo ground-truth odom과 비교해 확인). 도킹/병목우회 주행속도가 0.13~0.15m/s로
    # 느린데 기존 update_min_d=0.25m 기준으로는 그 거리를 쌓는 데만 1.7~2초가 걸려—
    # 그 동안 /amcl_pose가 갱신 없이 그대로 멈춰있다가 임계값을 넘는 순간 한 번에
    # 크게(그 사이 누적된 오도메트리 오차만큼) "점프"하는 것으로 재현됨. 값을 낮춰
    # 훨씬 자주(느린 저속 구간에서도) 갱신되도록 함 — 입자 500~2000개+max_beams=60
    # 조합에서 갱신 빈도를 올려도 이 정도 부하는 감당 가능(실측 CPU 여유 확인).
    update_min_a: 0.05
    update_min_d: 0.05
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan
    set_initial_pose: false   # 초기 pose는 parking_navigator 노드가 /initialpose로 발행

amcl_map_client:
  ros__parameters:
    use_sim_time: false

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: false

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    # default_nav_to_pose_bt_xml/default_nav_through_poses_bt_xml을 빈 문자열로 명시하면
    # bt_navigator가 실제로 "Empty Tree" 예외를 던지고 모든 목표를 즉시 실패시킨다
    # (BehaviorTreeEngine: "Empty Tree. Exiting with failure.", 실측 확인 2026-08-19).
    # nav2_bringup 공식 기본 params.yaml도 이 두 키를 아예 안 씀 — bt_navigator 자체의
    # 내장 기본값(nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml 등)이
    # 적용되도록 여기서도 키 자체를 생략한다.
    # [2026-08-22 도입 → 2026-08-24 원복] 한때 "대회 실차는 후진 금지"라는 (잘못된) 전제로
    # <BackUp/>을 뺀 커스텀 트리(config/behavior_trees/navigate_to_pose_no_reverse.xml)를
    # 여기 지정했었다. 후진이 실제로는 완전히 허용된다는 게 확인되어(2026-08-24) 그
    # 커스텀 트리와 이 오버라이드를 제거하고 nav2 기본 트리(BackUp 포함)로 되돌린다 —
    # 절대경로 하드코딩 문제도 이걸로 같이 해소됨.
    # 원래 이 목록엔 nav2_navigate_to_pose_action_bt_node용 트리에 필요한 것들만 일부
    # 담겨 있었는데, bt_navigator는 activate 시 navigate_to_pose "그리고"
    # navigate_through_poses 기본 트리를 둘 다 로드하려고 시도한다 — through_poses
    # 트리(navigate_through_poses_w_replanning_and_recovery.xml)가 쓰는
    # RemovePassedGoals 등 여러 노드가 빠져 있어서 "Node not recognized"로 bt_navigator
    # 전체 activate가 실패하고, 그 결과 모든 navigate_to_pose 목표가 거부되는 것을 실측
    # 확인함(2026-08-19). nav2_bringup 공식 기본 params.yaml의 전체 목록으로 교체해
    # 두 트리 모두 확실히 로드되게 한다.
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # 목표 근처에서 5cm/3도 정밀도로 미세 정렬하는 마지막 단계는 당연히 0.5m씩
      # 크게 움직이지 않는데, 원래 값(0.5m/10초)은 그 상황을 "진행 없음"으로 오판해
      # 시간초과로 abort시켰다(실측 확인, 2026-08-19 — 경로 끝(거리 0)까지는 정상 주행,
      # 그 이후 미세정렬 중 46초 만에 실패). 정밀도(xy/yaw_goal_tolerance) 자체는 원래
      # 요구사항이라 안 건드리고, "진행 중"으로 인정하는 이동량/유예시간만 완화한다.
      required_movement_radius: 0.05
      movement_time_allowance: 30.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.05     # 주차 정밀도: 5cm
      yaw_goal_tolerance: 0.05    # 약 3도
      stateful: true

    # DWBLocalPlanner(dwb_core) -> RegulatedPurePursuitController 교체 이유: DWB의
    # RotateToGoal 크리틱은 미분구동 로봇처럼 "제자리 회전"(linear.x=0, angular.z!=0)을
    # 명령할 수 있는데, 이 차는 애커먼만(자전거 모델)이라 그 명령을 물리적으로 수행할 수
    # 없다 — cmd_vel_bridge.py가 그걸 [조향각 최대, 속도 0]으로 변환해서 바퀴만 꺾인 채
    # 영원히 정지해 있는 것을 실측 확인함(2026-08-19, Gazebo 시뮬레이션에서 목표까지
    # 4.48m 경로는 나왔는데 "남은 거리"가 2분 넘게 그대로였음). RegulatedPurePursuit는
    # Nav2가 애커먼만/차량형 로봇용으로 공식 권장하는 컨트롤러 — 항상 curvature 기반으로
    # (v,w) 쌍을 계산해서 linear.x가 0이 되는 명령을 내지 않는다.
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # 실측 최대 지상속도는 1.449 m/s(cmd=20, 실제속도측정.md)지만, 주차는 5cm/3도 정밀도가
      # 필요한 정지 기동이라 안전 여유를 크게 두고 0.6 m/s로 제한(desired_linear_vel은
      # "목표"일 뿐 아래 velocity_smoother.max_velocity(0.4)가 최종 상한 — 실제 주행은
      # 항상 0.4 m/s 이하로 나감. 추후 실차에서 오버슈트/진동 없으면 올려도 됨).
      desired_linear_vel: 0.6
      lookahead_dist: 0.4
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.6
      lookahead_time: 1.5
      transform_tolerance: 0.2
      # [2026-08-22] 여기서부터 pull받은 팀원 커밋(190b764)과 병합충돌 발생 — 팀원 쪽
      # (critics/BaseObstacle.scale 등)은 DWBLocalPlanner 시절 설정을 손본 것인데, 이
      # 컨트롤러는 이미 위(line 169) plugin이 RegulatedPurePursuitController로 바뀐 뒤라
      # critics 파라미터 자체가 안 먹는다(DWB 전용 개념) — 팀원 브랜치가 DWB→RPP 전환
      # 커밋보다 먼저 갈라져서 그 사실을 몰랐던 것으로 보임. RPP 설정(아래, 오늘 세션
      # 내내 실측 튜닝한 것)만 남기고 DWB critics 쪽은 버린다. "장애물 회피 비중을
      # 올린다"는 팀원 의도 자체는 아래 use_cost_regulated_linear_velocity_scaling +
      # regulated_linear_scaling_*로 RPP 방식으로 이미 반영돼 있다.
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      # [2026-08-20] 곡률 기반 감속만으로는 좁은 통로 "직선" 구간(곡률은 작은데 벽은
      # 가까운 경우)에서 속도를 안 줄여서, 추종오차가 그대로 벽 접촉으로 이어지는 사고가
      # 반복됨(마진을 올려도 다른 지점에서 재현) — costmap 비용(=장애물 근접도) 기반
      # 감속도 같이 켜서, 곡률과 무관하게 벽 가까이에서는 항상 천천히/정밀하게 추종하게 한다.
      use_cost_regulated_linear_velocity_scaling: true
      # 아래 costmap inflation_layer의 cost_scaling_factor와 반드시 같은 값이어야
      # RPP가 비용→실제거리를 올바르게 역산한다(안 맞으면 감속 타이밍이 어긋남).
      inflation_cost_scaling_factor: 8.0
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.15
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.25
      # 애커먼만 차량은 제자리 회전이 불가능하므로 반드시 false — Nav2 공식 문서도
      # "ackermann 로봇은 항상 false로 두라"고 명시함. false면 큰 헤딩오차도 회전이 아니라
      # curvature를 크게 줘서(=조향각을 크게) 전진하며 도는 방식으로만 처리한다.
      use_rotate_to_heading: false
      max_angular_accel: 3.2
      max_robot_pose_search_dist: 10.0
      # min_turning_radius = WHEELBASE_M / tan(ANGLE_MAX_DEG) = 0.335 / tan(80°) ≈ 0.059m
      # (vehicle_spec.py 실측값 기반 역산치, 실측 아님).
      min_turning_radius: 0.06
      use_interpolation: true
      # [2026-08-22 도입 → 2026-08-24 원복] "대회 실차는 후진 금지"라는 전제로 false를
      # 썼었는데, 그 전제가 잘못된 것으로 확인됨(2026-08-24, 사용자 확인) — 후진은 완전히
      # 허용된다. true로 되돌려 아래 planner_server.GridBased의 REEDS_SHEPP(후진 허용
      # 경로탐색)와 다시 정합을 맞춘다.
      allow_reversing: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      # [2026-08-22] 3x3m -> 5x5m. 실행 중 "Dimensions of the costmap are too small
      # to encapsulate the robot footprint at current speeds!"(RegulatedPurePursuit)
      # 경고와 함께 "Sensor origin ... out of map bounds"(로봇이 롤링 윈도우 밖으로
      # 나가 raytrace 불가)가 반복 관측됨 — inflation_radius/cost_scaling_factor
      # 튜닝과는 무관한 별개 원인이라 크기만 키운다(장애물 회피 민감도 관련 값은 그대로 둠).
      width: 5
      height: 5
      resolution: 0.05
      # 직사각형 footprint(길이 0.64 x 폭 0.31)로 한 번 바꿔봤으나, RegulatedPurePursuit의
      # collision-lookahead 계산이 회전된 사각형 스윕을 잘못 처리하는 것으로 보여
      # 스폰 직후부터 "detected collision ahead!"로 아예 못 움직이는 회귀가 발생함
      # (2026-08-19 실측) — 원형 근사(robot_radius)로 되돌림. 내부 기둥 사이 좁은
      # 통로(~0.9m) 클리어런스 문제는 cost_scaling_factor로 대응 중(아래 참고).
      # 실측 길이0.64m x 폭0.31m의 외접원 반경 ≈ 0.36m(base_link=차량 중심 근사, 정확한
      # 축 위치 미실측이라 근사치).
      robot_radius: 0.36
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # [2026-08-22] 팀원 커밋(190b764)이 여기서 inflation_radius를 0.45(robot_radius
        # 0.36보다 크게)로 고치자고 제안했는데 — 진단(inflation_radius<robot_radius면
        # 완충구역이 사실상 없다)은 정확하다. 다만 오늘 이 세션에서 실측으로 이미 그
        # 값(0.45)을 시도해봐서 안다: robot_radius(0.36)+inflation_radius(0.45)=0.81m가
        # 주차영역 A 목표(벽에서 0.5m)보다 커서, 그 값을 쓰면 목표 지점 자체가 코스트맵
        # 상 "통행불가" 영역에 들어가 플래너가 계획 자체를 못 짠다(아래 0.1 관련 주석
        # 참고, 이게 바로 그 실측 근거). 그래서 inflation_radius는 낮게 유지하고 대신
        # cost_scaling_factor를 올리는 쪽으로 오늘 세션 내내 튜닝했다 — 아래 값 유지.
        # inflation_radius를 0.1로 줄인 만큼(주차영역 A 목표 도달을 위해) 장애물을 밀어내는
        # 힘도 약해져서, 실측 결과 좁은 통로(내부 기둥 사이 ~1m)에서 경로가 한쪽 장애물에
        # 거의 닿을 정도로 붙어버리는 것을 확인함(2026-08-19, base_link가 기둥에서
        # 0.25m까지 근접, robot_radius 0.36m보다 가까움 — "Failed to make progress"로
        # 컨트롤러가 정지). inflation_radius(도달 가능성과 직결)는 더 못 줄이니, 대신
        # cost_scaling_factor를 3.0->8.0으로 높여 좁은 반경 안에서도 장애물 근처 비용이
        # 훨씬 가파르게 커지도록 해서 경로가 통로 중앙 쪽으로 더 붙게 유도한다.
        # [2026-08-20] 8.0에서도 마진을 올려가며 재현되는 벽 접촉이 계속돼서 12.0으로
        # 추가 상향(마진/풋프린트는 그대로 — 경로 "선호"만 더 강하게 중앙으로 유도).
        # FollowPath.inflation_cost_scaling_factor와 반드시 같은 값이어야 함(위 참고).
        # [2026-08-20] 12.0으로 올린 직후 스폰 위치 근처에서 "Starting point in lethal
        # space"가 새로 발생 — 이전(8.0)엔 없던 증상이라 회귀 의심돼 8.0으로 되돌리고
        # use_cost_regulated_linear_velocity_scaling 단독 효과부터 분리 확인한다.
        cost_scaling_factor: 8.0
        # 원래 0.3 — 주차영역 A 목표(0,4.2)가 벽에서 정확히 0.5m 떨어져 있는데,
        # robot_radius(0.36) + inflation_radius(0.3) = 0.66m가 그보다 커서 목표 지점
        # 자체가 코스트맵 inflation 영역(사실상 통행불가로 취급됨)에 걸려 플래너가
        # "failed to create plan with tolerance 0.50"로 계속 실패하는 것을 실측 확인함
        # (2026-08-19). robot_radius(0.36) + 0.1 = 0.46m < 0.5m로 여유를 두기 위해
        # 0.1로 낮춤 — 목표 좌표 자체는 그대로 두고(실측/대회 기준일 수 있어 안 건드림)
        # 안전여유만 줄인 것이므로, 장애물 회피 민감도가 전반적으로 낮아짐에 유의.
        inflation_radius: 0.1
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      # [2026-08-25] 한때 이 자리를 robot_radius(0.36, 원형)로 되돌렸었다("사각형이
      # SmacPlannerHybrid의 폴리곤 충돌검사에서 대각선(~0.45m)까지 걸린다"는 이론
      # 때문) — 그런데 되돌린 뒤에도 "Starting point in lethal space"가 그대로
      # 재현됐고, `parking_map.pgm`을 distance-transform으로 직접 분석해보니 이
      # 병목 통로(y≈2.55~3.75 구간)는 최선의 x를 골라도 여유가 0.30~0.53m밖에 안 돼서,
      # 원형 robot_radius=0.36m 요구치(전 방향으로 0.36m 확보)조차 일부 구간(예:
      # y=3.75, 최선의 x에서도 0.35m)에서 물리적으로 못 채운다는 걸 확인했다 — 즉
      # 원형 모델은 이 통로에서 애초에 성립 불가능. 반대로 실제 차량 폭(0.31m,
      # vehicle_spec.py)에 맞춘 사각형(반폭 0.225m)은 이 통로가 어디서든 여유롭게
      # 통과 가능(0.30m 이상은 반폭 0.225m보다 크다) — 즉 사각형 자체는 이 좁은
      # 통로를 실제로 통과하기 위한 올바른 방향이었다. 그래서 사각형으로 다시
      # 되돌리고, 대신 실제 실패 원인이었던 AMCL 핸드오프 타이밍 버그를
      # parking_navigator.py의 _run_route_bypass()에서 고쳤다(타임아웃으로 병목우회가
      # 끝날 때도 AMCL을 데드레커닝 기준으로 강제 재정렬하도록) — 자세한 내용은 그
      # 커밋의 주석 참고. 치수: VEHICLE_LENGTH_M=0.64, VEHICLE_WIDTH_M=0.31
      # (vehicle_spec.py), base_link 원점=차량 중심 -> 반장/반폭 0.32/0.155,
      # 실측 접촉 이력(2026-08-20, clearance=0.0~0.22m에서 접촉 확인) 때문에 마진
      # 0.07m를 더해 0.39/0.225로 운용.
      footprint: "[[0.39, 0.225], [0.39, -0.225], [-0.39, -0.225], [-0.39, 0.225]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 사각형 footprint(위 참고) 기준 inscribed radius=min(0.39,0.225)=0.225m로
        # local_costmap의 원형 robot_radius(0.36m)보다 작다 — "목표(벽에서 0.5m)가
        # 통행불가가 된다"는 제약이 inscribed radius 기준(0.225+inflation_radius<0.5
        # => inflation_radius<0.275)이 되므로 0.25까지 늘려도 목표 도달가능성이 깨지지
        # 않는다(2026-08-22 실측 근거 — local_costmap의 0.1은 원형 robot_radius=0.36
        # 기준이라 그대로 둠). 폭 0.1로는 병목 통로에서 경로가 한쪽에 붙어(클리어런스
        # 0.10~0.11m) lethal-space로 막히는 걸 실측 확인했었다.
        cost_scaling_factor: 8.0
        inflation_radius: 0.25
      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: false
    # RewrittenYaml(nav2_common/launch/rewritten_yaml.py)은 yaml에 "이미 있는" leaf 키만
    # 덮어쓰고 없는 키는 추가하지 않는다 — 그래서 launch 인자(map)로 전달하려면 여기 빈
    # 값이라도 반드시 있어야 한다(nav2_bringup 공식 기본 params.yaml도 동일 패턴).
    # 이 줄이 없으면 map_server가 "parameter 'yaml_filename' is not initialized"로
    # configure 단계에서 즉시 죽는다(ros-humble-nav2-bringup 1.1.20 실제 설치본으로
    # 재현 확인, 2026-08-19).
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    # [2026-08-18] NavfnPlanner(격자 기반 순수 A*, 차량 회전반경을 모른다) -> SmacPlannerHybrid로
    # 교체. "벽에 부딪히고 멈추는" 문제의 한 원인이 여기 있었다 — 격자 A*가 짠 경로는 코너에서
    # 급하게 꺾이는 지점이 생길 수 있는데, 이 차는 Ackermann 조향이라 실제 추종 제어기가 그
    # 꺾임을 못 따라가고 코너를 잘라먹으며 벽을 스칠 수 있다. SmacPlannerHybrid는 최소 회전반경
    # 제약을 넣어 "차가 실제로 따라갈 수 있는" 곡선 경로만 생성한다(=사용자가 말한 Modified A*).
    GridBased:
      # [2026-08-22] 팀원 커밋(190b764)과 병합충돌 — 팀원도 독립적으로 같은 결론
      # (NavfnPlanner->SmacPlannerHybrid)에 도달했지만 두 가지가 이 세션의 실측
      # 검증과 안 맞아서 팀원 쪽을 버리고 내 쪽(아래)을 남긴다:
      #  1) plugin 이름이 "nav2_smac_planner::SmacPlannerHybrid"(콜론 두 개) 형식인데,
      #     이 환경에서 pluginlib이 "package/ClassAlias" 슬래시 형식만 인식하고 콜론
      #     형식은 "class ... does not exist" FATAL로 planner_server가 죽는 걸 오늘
      #     실측 확인함(behavior_server의 동일 문제와 같은 원인, 아래 behavior_server
      #     주석도 참고).
      #  2) minimum_turning_radius: 0.6을 "최대조향각 30도(설계값)" 가정으로 역산했는데,
      #     이 저장소의 vehicle_spec.py는 ANGLE_MAX_DEG=80.0(서보 클램프값)을 명시하고
      #     있고 FollowPath.min_turning_radius도 그 값 기준(0.06)으로 이미 맞춰져 있다
      #     — 두 플러그인이 같은 차량 물리 제약을 써야 하는데 0.6 vs 0.06으로 10배 차이.
      # [2026-08-20] NavfnPlanner -> SmacPlannerHybrid 교체. NavFn은 로봇을 원형
      # inflation(robot_radius/inflation_radius)으로만 판단해서 "통로는 넉넉하게,
      # 목표(벽에서 0.5m)는 빡빡하게"라는 상충을 costmap 파라미터 하나로 억지로
      # 맞춰야 했다(위 inflation_radius 0.1 관련 주석들 참고) — 그래도 안 됨: 실측
      # 결과 로봇이 실제로 넓은 통로(x≈0.5~0.9)를 놔두고 더 좁은 쪽(x≈1.3~1.9, 벽까지
      # 5cm)으로 경로를 잡아 거기서 막혔다(2026-08-20, parking_map.pgm 픽셀 분석+
      # AMCL pose 실측으로 확인). SmacPlannerHybrid는 애커먼만 운동학(조향 곡률)과
      # 실제 풋프린트로 매 후보 pose를 충돌검사하므로, 원형 근사가 만드는 이 왜곡을
      # 근본적으로 피할 수 있다 — 아래 global_costmap의 footprint(사각형)와 짝을 이룸.
      # pluginlib 조회명은 "package/ClassAlias" 형식(위 NavfnPlanner 때와 동일 이유).
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.5
      allow_unknown: false   # 주차장은 맵 밖 미탐사 영역으로 계획하지 않도록 false 권장
      # [2026-08-22 도입 → 2026-08-24 원복] "대회 실차는 후진 금지"라는 (잘못된) 전제로
      # DUBIN(전진만)을 썼었다 — 후진이 완전히 허용된다는 게 확인되어(2026-08-24) 원래
      # 의도(팀원 커밋 190b764도 독립적으로 같은 결론)였던 REEDS_SHEPP(후진 허용)으로
      # 되돌린다. 위 FollowPath.allow_reversing도 true로 맞춰 두 플러그인이 다시
      # 정합하도록 함. 2구역(A/B) 순회 + 출발지 복귀 미션에서 후진 진입이 필요한
      # T자/평행주차 형태를 지원하려면 이게 반드시 필요.
      motion_model_for_search: "REEDS_SHEPP"
      # REEDS_SHEPP 도입에 맞춰 추가 — 후진 자체를 막지는 않되(경로가 필요하면 씀),
      # 순수 전진보다 비용을 더 매겨서 불필요한 후진 남용(예: 왔다갔다 하며 최적화)을
      # 억제한다. 참고: 팀원 커밋(190b764)이 REEDS_SHEPP와 함께 쓰려 했던 값(2.0)을
      # 시작점으로 채택 — 시뮬레이션 실측 후 필요하면 조정.
      reverse_penalty: 2.0
      # WHEELBASE_M / tan(ANGLE_MAX_DEG) = 0.335 / tan(80°) ≈ 0.06m — 위 FollowPath의
      # min_turning_radius와 동일 값(같은 차량 물리 제약이므로 두 플러그인이 일치해야 함).
      minimum_turning_radius: 0.06
      # [2026-08-22] SmacPlannerHybrid로 바꿔도(위 2026-08-20 기록과 동일 증상 재발)
      # 여전히 넓은 서쪽 통로를 두고 동쪽 벽에 바짝 붙어(실측 클리어런스 0.10~0.11m,
      # parking_map.pgm 거리변환으로 확인) 지나가는 걸 재확인함 — inflation_radius가
      # 0.1m로 얇아서(목표 도달가능성 때문에 못 늘림, 위 관련 주석 참고) 그 얇은 대역을
      # 벗어난 두 경로(벽에 붙은 경로 vs 열린 경로)의 비용 차이가 순수 거리 차이에 묻힐
      # 만큼 작다고 보인다. cost_penalty(기본값 2.0, 코스트맵 비용을 거리 대비 얼마나
      # 중요하게 볼지)를 올려서, inflation_radius/목표 도달가능성은 그대로 두고 "벽에
      # 붙는 경로"에 대한 기피만 강화한다.
      # [2026-08-22] global_costmap.inflation_radius를 0.1->0.25로 넓힌 뒤(위 global_costmap
      # 주석 참고) 경로가 실제로 중앙(클리어런스 0.35~0.42m)으로 붙는 걸 실측 확인 —
      # 이전(중앙기둥에 0.10m로 붙던 것)보다는 크게 개선됐지만, 그 병목 통과 시점에
      # 로봇 헤딩이 통로 축과 비스듬해지며(경로가 그 지점에서 커브 중) 풋프린트의
      # 유효 폭이 늘어나 여전히 간헐적으로 lethal 판정이 나는 걸 확인함(스크린샷으로
      # 확인: 차량이 그 좁은 지점에 대각선으로 낌). cost_penalty를 4.0->6.0으로 추가
      # 상향해 그 병목 주변 비용 기피를 더 강하게 만들어, 플래너가 그 지점을 헤딩이
      # 더 안정된(통로 축에 가까운) 상태로 지나가는 경로를 찾도록 유도한다.
      cost_penalty: 4.0

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    # "backup"(BackUp)을 플러그인 목록에서 빼면 bt_navigator 전체가 activate 실패한다
    # (activate 시 navigate_through_poses 기본 트리도 같이 로드를 시도하는데, 그 트리가
    # BackUp을 참조하므로 "backup" 액션서버가 없으면 "Action server backup not
    # available"로 bt_navigator 자체가 안 뜸, 실측 확인 2026-08-22). 후진이 허용되는
    # 지금은 이 액션서버가 기본 트리의 복구 폴백에서 실제로도 정상적으로 호출된다.
    behavior_plugins: ["spin", "backup", "wait"]
    # nav2_navfn_planner와 동일한 이유(pluginlib 조회명은 "package/ClassAlias" 형식) —
    # nav2_behaviors의 behavior_plugin.xml도 슬래시로 export돼 있음. "::" 형식은
    # behavior_server가 "class ... does not exist" FATAL로 죽는 것을 확인(2026-08-19).
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_timeout: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.5
    min_rotational_vel: 0.1
    rotational_acc_lim: 1.5

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.4, 0.0, 0.8]     # controller_server FollowPath와 동일 근거
    min_velocity: [-0.4, 0.0, -0.8]
    max_accel: [0.5, 0.0, 1.5]        # controller_server FollowPath와 동일 근거(실측 없음, 추정치)
    max_decel: [-0.5, 0.0, -1.5]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
